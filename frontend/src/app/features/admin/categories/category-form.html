<section class="category-form page-fade-in">
  <app-page-header
    icon="categories"
    [title]="(editingId() ? 'admin.categories.editTitle' : 'admin.categories.addTitle') | translate"
  />

  <form class="form-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="form-grid">
      <div class="field full" [class.invalid]="invalid('nameAl')" appReveal>
        <label class="field-label" for="cat-name-al">{{ 'admin.categories.nameAl' | translate }}</label>
        <div class="control">
          <span class="prefix">AL</span>
          <input id="cat-name-al" type="text" formControlName="nameAl" autocomplete="off" />
          @if (ok('nameAl')) {
            <app-icon class="ok" name="check-circle" [size]="19" />
          }
        </div>
        @if (invalid('nameAl')) {
          <span class="field-error">
            <app-icon name="alert" [size]="14" />
            {{ 'admin.categories.nameRequired' | translate }}
          </span>
        }
      </div>

      <div class="field full" [class.invalid]="invalid('nameEn')" appReveal [revealDelay]="70">
        <label class="field-label" for="cat-name-en">{{ 'admin.categories.nameEn' | translate }}</label>
        <div class="control">
          <span class="prefix">EN</span>
          <input id="cat-name-en" type="text" formControlName="nameEn" autocomplete="off" />
          @if (ok('nameEn')) {
            <app-icon class="ok" name="check-circle" [size]="19" />
          }
        </div>
        @if (invalid('nameEn')) {
          <span class="field-error">
            <app-icon name="alert" [size]="14" />
            {{ 'admin.categories.nameRequired' | translate }}
          </span>
        }
      </div>
    </div>

    @if (errorMessage()) {
      <div class="error-box">
        <app-icon name="alert" [size]="20" />
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <div class="form-actions">
      <a appBtn="secondary" icon="close" routerLink="/admin/categories">{{ 'common.cancel' | translate }}</a>
      <button type="submit" appBtn="primary" icon="save" [loading]="submitting()" [disabled]="submitting()">
        {{ submitting() ? ('admin.categories.saving' | translate) : ('admin.categories.save' | translate) }}
      </button>
    </div>
  </form>
</section>
