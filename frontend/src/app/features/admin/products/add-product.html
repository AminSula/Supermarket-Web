<section class="add-product">
  <h1>{{ 'admin.addProduct.title' | translate }}</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      {{ 'admin.addProduct.name' | translate }}
      <input type="text" formControlName="name" />
      @if (form.get('name')?.invalid && form.get('name')?.touched) {
        <span class="error">{{ 'admin.addProduct.nameRequired' | translate }}</span>
      }
    </label>

    <label>
      {{ 'admin.addProduct.description' | translate }}
      <textarea formControlName="description" rows="3"></textarea>
    </label>

    <label>
      {{ 'admin.addProduct.price' | translate }}
      <input type="number" step="0.01" formControlName="price" />
      @if (form.get('price')?.invalid && form.get('price')?.touched) {
        <span class="error">{{ 'admin.addProduct.priceInvalid' | translate }}</span>
      }
    </label>

    <label>
      {{ 'admin.addProduct.stock' | translate }}
      <input type="number" formControlName="stock" />
      @if (form.get('stock')?.invalid && form.get('stock')?.touched) {
        <span class="error">{{ 'admin.addProduct.stockInvalid' | translate }}</span>
      }
    </label>

    <label>
      {{ 'admin.addProduct.categoryId' | translate }}
      <select formControlName="categoryId">
        <option [ngValue]="null" disabled>{{ 'admin.addProduct.categoryPlaceholder' | translate }}</option>
        @for (category of categories(); track category.id) {
          <option [ngValue]="category.id">{{ category.name }}</option>
        }
      </select>
      @if (form.get('categoryId')?.invalid && form.get('categoryId')?.touched) {
        <span class="error">{{ 'admin.addProduct.categoryRequired' | translate }}</span>
      }
    </label>

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? ('admin.addProduct.saving' | translate) : ('admin.addProduct.save' | translate) }}
    </button>

    @if (successMessage()) {
      <p class="success">{{ successMessage() }}</p>
    }
    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }
  </form>
</section>
